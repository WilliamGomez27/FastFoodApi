<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood Manager – Iniciar Sesión</title>
    <meta name="description" content="Panel de administración para gestionar tu restaurante FastFood.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <!-- Decoración de fondo -->
        <div class="login-bg-orb orb-1"></div>
        <div class="login-bg-orb orb-2"></div>

        <div class="login-card glass-card">
            <div class="login-header">
                <span class="logo-icon">🍔</span>
                <h1>FastFood <span class="highlight">Manager</span></h1>
                <p>Inicia sesión para gestionar tu restaurante</p>
            </div>

            <form id="login-form" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="manager@restaurante.com"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" id="toggle-password" class="toggle-pw-btn" title="Mostrar contraseña">👁️</button>
                    </div>
                </div>

                <div class="form-error" id="login-error" aria-live="polite"></div>

                <button type="submit" class="btn primary-btn" id="login-submit-btn">
                    <span id="btn-text">Iniciar Sesión</span>
                    <span id="btn-spinner" class="spinner hidden"></span>
                </button>
            </form>

            <p class="login-footer">
                Panel de Administración · <span class="highlight">FastFood App</span>
            </p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
