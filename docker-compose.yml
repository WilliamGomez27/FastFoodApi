services:
  # ── Base de datos MySQL ──────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: fastfood_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root1234}
      MYSQL_DATABASE: supermarket_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fastfood_net

  # ── Backend Node.js ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./FastFoodBackend
      dockerfile: Dockerfile
    container_name: fastfood_backend
    restart: unless-stopped
    env_file:
      - ./FastFoodBackend/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fastfood_net

  # ── Frontend estático (Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./FastFoodFrontend
      dockerfile: Dockerfile
    container_name: fastfood_frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fastfood_net

# ── Volúmenes y redes ────────────────────────────────────────────────────────
volumes:
  db_data:

networks:
  fastfood_net:
    driver: bridge
